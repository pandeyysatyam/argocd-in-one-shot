apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-list
  namespace: argocd
spec:
  # The list generator lets you enumerate a static set of elements (apps).
  generators:
    - list:
        elements:
          - app: nginx
            path: 04_first_app_deployment/ui_approach/nginx     # path in repo for this app
          - app: online-shop
            path: 04_first_app_deployment/declarative_approach/online_shop   # path in repo for this app
          - app: chaiapp
            path: 06_argocd_notifications/chai-app.yaml      # path in repo for this app
  # Template that will be used to generate individual Application CRs
  template:
    metadata:
      # name template uses the element key 'app'
      name: '{{app}}-list'
    spec:
      project: default
      source:
        repoURL: https://github.com/pandeyysatyam/argocd-in-one-shot.git
        targetRevision: main
        path: '{{path}}'                # resolved from element
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
